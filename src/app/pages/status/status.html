<div class="status-page">
  <!-- Confetti Background -->
  <div class="status__bg" aria-hidden="true">
    <svg class="status__bg-shape1" fill="currentColor" viewBox="0 0 200 200">
      <path d="M45.7,-76.3C58.9,-69.3,69.1,-56.9,76.5,-43C83.9,-29.1,88.5,-13.6,86.6,1.1C84.7,15.8,76.3,29.7,66.7,41.9C57.1,54.1,46.3,64.6,33.5,71.2C20.7,77.8,5.9,80.5,-8.3,79.1C-22.5,77.7,-36.1,72.2,-48.1,64.2C-60.1,56.2,-70.5,45.7,-77.3,33C-84.1,20.3,-87.3,5.4,-84.9,-8.6C-82.5,-22.6,-74.5,-35.7,-64,-46.7C-53.5,-57.7,-40.5,-66.6,-26.8,-73.2C-13.1,-79.8,1.3,-84.1,15.4,-82.6C29.5,-81.1,43.2,-73.8,45.7,-76.3Z" transform="translate(100 100)"></path>
    </svg>
    <svg class="status__bg-shape2" fill="currentColor" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="80"></circle>
    </svg>
  </div>

  <div class="status__inner">
    <app-status-banner />
    
    <div class="status__grid">
      <div class="status__col-main">
        <app-status-ticket (onConfirm)="openModal()" />
        <app-status-timeline />
      </div>
      <div class="status__col-side">
        <app-status-info />
      </div>
    </div>
  </div>

  @if(isModalOpen()) {
    <app-status-modal (onClose)="closeModal()" />
  }
</div>
