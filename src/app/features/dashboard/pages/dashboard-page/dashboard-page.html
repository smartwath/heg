<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Realtime Dashboard</h1>
  
  <div class="bg-white shadow rounded-lg p-4">
    <h2 class="text-xl font-semibold mb-3">Live Events</h2>
    
    @if (recentEvents().length === 0) {
      <p class="text-gray-500">Waiting for events...</p>
    } @else {
      <div class="space-y-3">
        @for (event of recentEvents(); track event.time) {
          <div class="border-l-4 border-blue-500 bg-blue-50 p-3 rounded shadow-sm">
            <div class="flex justify-between">
              <span class="font-bold text-blue-700">{{ event.type }}</span>
              <span class="text-sm text-gray-500">{{ event.time | date:'mediumTime' }}</span>
            </div>
            <pre class="mt-2 text-sm text-gray-700 overflow-x-auto">{{ event.data | json }}</pre>
          </div>
        }
      </div>
    }
  </div>
</div>
